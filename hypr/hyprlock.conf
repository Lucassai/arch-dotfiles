# Hyprlock basic configuration
# Use a solid background or an image path below.
background = /home/lucas/.config/hypr/lockscreen.jpg

# Blur effect behind the lock screen
blur = 8

# Lock indicator styling
indicator-color = 0xFF84C2FF
indicator-radius = 120
indicator-thickness = 5
indicator-position = center
indicator-shadow = yes

# Text settings
font = "monospace 18"
text-color = 0xFFFFFFFF
caption = "Tela bloqueada"

# Behavior
show-capslock = yes
show-numlock = yes
enable-mouse = no
refresh-rate = 60

# Timeout before returning to lock screen when idle
idle-timeout = 300
